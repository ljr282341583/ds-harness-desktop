<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>正在启动</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #11141a;
        color: #e6e8ee;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .box { text-align: center; }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 3px solid #2a2f3a;
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .text { font-size: 14px; color: #9aa3b2; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div class="text">正在启动 DeepSeek Harness…</div>
    </div>
  </body>
</html>
