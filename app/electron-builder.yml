# DS Harness Desktop — electron-builder 配置
appId: com.dsh.desktop
productName: DS Harness Desktop
electronLanguages:
  - zh-CN
  - en-US

directories:
  # 产出放到项目级 产出\ 目录
  output: ../产出
  buildResources: build

# 打包后用完整 node_modules 覆盖（electron-builder 的生产依赖裁剪对 DSH 依赖树不完整）
afterPack: build/afterPack.js

files:
  - src/**
  - assets/**
  - package.json
  - "!node_modules/.cache/**"

# 打包生产依赖（含捆绑的 @deepseek-ai/dsh 及其依赖）
# 关键：dsh 由独立 Node 侧车（runtime/node.exe）执行，侧车不识别 asar，
# 因此必须关闭 asar，让 dsh 及其依赖以普通文件落盘，侧车才能直接读取。
asar: false

# 外壳自更新（electron-updater）的发布源。
# 打包时会生成 latest.yml 并写入 resources/app-update.yml，客户端据此匿名拉取更新。
# 仓库必须是公开仓库，否则客户端拿不到清单与安装包。
publish:
  provider: github
  owner: ljr282341583
  repo: ds-harness-desktop
  # 直接发布为正式 Release。electron-builder 默认建草稿，草稿对客户端不可见，
  # 会导致「检查桌面端更新」永远拉不到新版本。
  releaseType: release

# 把独立 Node 运行时复制到 resources/runtime，供主进程 spawn dsh
extraResources:
  - from: runtime
    to: runtime

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # v1 不签名，同时跳过 exe 资源编辑，避免下载 winCodeSign（其 7z 含符号链接，需管理员/开发者模式才能解压）
  # 图标/版本信息改由 build/afterPack.js 里的 rcedit 步骤嵌入
  signAndEditExecutable: false

nsis:
  # 保留向导式安装，允许自选安装目录。
  # 注意：v0.3.1 的自动更新曾把应用装坏，根因是"安装器与正在退出的 dsh 子进程
  # 抢安装目录里的文件"（已在 main.js 用 stopHarnessAndWait 修复），与安装器类型无关，
  # 因此这里不牺牲"自选安装目录"这个能力。
  # 若将来仍出现更新后装坏，再考虑切换为 oneClick（代价是不能自选目录）。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DS Harness Desktop

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
