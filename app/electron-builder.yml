# DS Harness Desktop — electron-builder 配置
appId: com.dsh.desktop
productName: DS Harness Desktop
electronLanguages:
  - zh-CN
  - en-US

directories:
  # 产出放到项目级 产出\ 目录
  output: ../产出
  buildResources: build

# 打包后用完整 node_modules 覆盖（electron-builder 的生产依赖裁剪对 DSH 依赖树不完整）
afterPack: build/afterPack.js

files:
  - src/**
  - assets/**
  - package.json
  - "!node_modules/.cache/**"

# 打包生产依赖（含捆绑的 @deepseek-ai/dsh 及其依赖）
# 关键：dsh 由独立 Node 侧车（runtime/node.exe）执行，侧车不识别 asar，
# 因此必须关闭 asar，让 dsh 及其依赖以普通文件落盘，侧车才能直接读取。
asar: false

# 把独立 Node 运行时复制到 resources/runtime，供主进程 spawn dsh
extraResources:
  - from: runtime
    to: runtime

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # v1 不签名，同时跳过 exe 资源编辑，避免下载 winCodeSign（其 7z 含符号链接，需管理员/开发者模式才能解压）
  # 图标/版本信息改由 build/afterPack.js 里的 rcedit 步骤嵌入
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DS Harness Desktop

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
